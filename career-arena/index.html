<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061b48">
<title>Đấu trường nghề nghiệp | Career Arena</title>
<link rel="stylesheet" href="assets/css/shared.css?v=career-arena-responsive-v20261115">
<link rel="stylesheet" href="assets/css/home.css?v=eduverse-home-20261120">
</head>
<body>
<div class="site-bg"></div>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="Đấu trường nghề nghiệp">
    <span class="brand-mark">★</span>
    <span>ĐẤU TRƯỜNG<br>NGHỀ NGHIỆP</span>
  </a>
  <a class="back-to-eduverse" href="https://historyandgeegraphyeducation.github.io/Eduverse/#ev?tab=practice">TRỞ VỀ EDUVERSE</a>
</header>
<main class="wrap home-wrap">
  <section class="panel hero reveal">
    <h1 class="title">KHÁM PHÁ<br>THẾ GIỚI NGHỀ NGHIỆP</h1>
    <div class="actions">
      <a class="btn secondary" href="room.html">TẠO PHÒNG CHƠI</a>
    </div>
  </section>
  <section class="room-entry panel" aria-label="Phòng chơi trực tuyến">
    <div class="room-entry-main">
      <div class="room-entry-copy">
        <h2>Phòng chơi trực tuyến</h2>
      </div>
      <form id="studentRoomForm" class="room-code-form">
        <label class="sr-only" for="studentRoomCode">Mã phòng</label>
        <input id="studentRoomCode" name="roomCode" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="NHẬP MÃ PHÒNG" required>
        <button class="btn" type="submit">THAM GIA</button>
      </form>
      <button id="teacherEntryToggle" class="teacher-entry-icon" type="button" aria-label="Truy cập dành cho giáo viên" aria-expanded="false" title="Giáo viên">🧑‍🏫</button>
    </div>
    <form id="teacherRoomForm" class="teacher-room-form hidden">
      <strong>Truy cập dành cho giáo viên</strong>
      <label class="sr-only" for="teacherRoomCode">Mã truy cập giáo viên</label>
      <input id="teacherRoomCode" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="MÃ GIÁO VIÊN" required>
      <button class="btn secondary" type="submit">VÀO BẢNG ĐIỀU KHIỂN</button>
    </form>
    <p id="roomEntryMessage" class="room-entry-message" aria-live="polite"></p>
  </section>
</main>
<script src="assets/js/shared.js"></script>
<script src="assets/js/home.js?v=eduverse-home-20261120"></script>
</body>
</html>
