<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a40c8">
<title>EDUVERSE – Hệ sinh thái giáo dục số</title>
<link rel="stylesheet" href="css/style.css?v=20261111-new-badge">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="st" viewBox="0 0 20 20"><defs><radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><circle cx="10" cy="10" r="10" fill="url(#halo)"/><path d="M10 0C11 6 14 9 20 10 14 11 11 14 10 20 9 14 6 11 0 10 6 9 9 6 10 0Z" fill="#fff"/></symbol></defs></svg>
<div id="app">
  <div class="top">
    <div class="brand">
      <div class="stars" id="stars"><i class="shoot"></i></div>
      <svg class="logo" viewBox="0 0 64 64" aria-label="Logo EDUVERSE – University Junior High School" overflow="visible">
        <defs>
          <radialGradient id="ocean" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#d9ab3f"/><stop offset=".5" stop-color="#a97918"/><stop offset="1" stop-color="#4f3408"/></radialGradient>
          <radialGradient id="oceanU" gradientUnits="userSpaceOnUse" cx="24.8" cy="26.4" r="38.4"><stop offset="0" stop-color="#d9ab3f"/><stop offset=".5" stop-color="#a97918"/><stop offset="1" stop-color="#4f3408"/></radialGradient>
          <linearGradient id="landfill" gradientUnits="userSpaceOnUse" x1="14" y1="16" x2="50" y2="58"><stop offset="0" stop-color="#fff6c2"/><stop offset="1" stop-color="#eac15a"/></linearGradient>
          <radialGradient id="shade" cx="35%" cy="30%" r="80%"><stop offset=".5" stop-color="#3a2400" stop-opacity="0"/><stop offset="1" stop-color="#3a2400" stop-opacity=".6"/></radialGradient>
          <radialGradient id="shine" cx="30%" cy="24%" r="34%"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb300"/><stop offset=".5" stop-color="#ffe680"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
          <radialGradient id="lglow"><stop offset=".55" stop-color="#ffd76a" stop-opacity=".28"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
          <linearGradient id="capgold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".55" stop-color="#e0b04a"/><stop offset="1" stop-color="#a87a1f"/></linearGradient>
          <path id="ringtext" d="M5,33 A27,27 0 0 0 59,33" fill="none"/>
          <clipPath id="orbFront"><rect x="-40" y="0" width="80" height="30"/></clipPath>
          <clipPath id="orbBack"><rect x="-40" y="-30" width="80" height="30"/></clipPath>
          <clipPath id="gc"><circle cx="32" cy="36" r="21"/></clipPath>
        </defs>
        <circle cx="32" cy="34" r="36" fill="url(#lglow)"/>
        <!-- Huy hiệu: vòng vàng + chữ -->
        <circle cx="32" cy="33" r="30.6" fill="#0c1a80" fill-opacity=".28" stroke="url(#capgold)" stroke-width="1.5"/>
        <text fill="#ffe680" font-family="Montserrat,'Segoe UI',Arial,sans-serif" font-weight="300" font-size="3.3" letter-spacing=".3"><textPath href="#ringtext" startOffset="50%" text-anchor="middle">UNIVERSITY JUNIOR HIGH SCHOOL</textPath></text>
        <g transform="translate(32 33) scale(.72) translate(-32 -34)">
        <!-- Nửa sau của quỹ đạo + tên lửa: nằm DƯỚI Trái Đất nên bị che khi bay ra phía sau -->
        <g transform="translate(32 36) rotate(-20)">
          <g clip-path="url(#orbBack)">
            <path d="M-30,0 a30,9 0 1,0 60,0 a30,9 0 1,0 -60,0" pathLength="100" fill="none" stroke="#ffd23f" stroke-opacity=".35" stroke-width="5" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="100">
              <animate attributeName="stroke-dashoffset" dur="10s" begin="-6s" repeatCount="indefinite" values="100;0;0;0" keyTimes="0;.3;.85;1"/>
              <animate attributeName="opacity" dur="10s" begin="-6s" repeatCount="indefinite" values="1;1;1;0" keyTimes="0;.3;.85;1"/>
            </path>
            <path d="M-30,0 a30,9 0 1,0 60,0 a30,9 0 1,0 -60,0" pathLength="100" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="100">
              <animate attributeName="stroke-dashoffset" dur="10s" begin="-6s" repeatCount="indefinite" values="100;0;0;0" keyTimes="0;.3;.85;1"/>
              <animate attributeName="opacity" dur="10s" begin="-6s" repeatCount="indefinite" values="1;1;1;0" keyTimes="0;.3;.85;1"/>
            </path>
          </g>
          <g>
            <animateMotion dur="10s" begin="-6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.3;1" calcMode="linear"><mpath href="#orbit"/></animateMotion>
            <animate attributeName="opacity" dur="10s" begin="-6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.149;.15;.29;.31;1"/>
            <g transform="scale(1.35)">
              <path class="flame" d="M-5,-1.7 L-12,0 L-5,1.7Z" fill="#ffb300"/>
              <path d="M-5,-1 L-8.5,0 L-5,1Z" fill="#fff6c8"/>
              <path d="M7,0 C4,-3 0,-3 -5,-2.6 L-5,2.6 C0,3 4,3 7,0Z" fill="#fff6d0" stroke="#6b4a10" stroke-width=".55"/>
              <circle cx="1" cy="0" r="1.3" fill="#6b4a10" stroke="#fff1b3" stroke-width=".4"/>
              <path d="M-2.6,-2.5 L-6.5,-5.2 L-5,-2.5Z M-2.6,2.5 L-6.5,5.2 L-5,2.5Z" fill="#d98a1a" stroke="#6b4a10" stroke-width=".3"/>
            </g>
          </g>
        </g>
        <!-- Trái Đất quay -->
        <g clip-path="url(#gc)">
          <rect x="8" y="12" width="48" height="48" fill="url(#ocean)"/>
          <!-- Trái Đất chiếu trực giao, xoay Tây→Đông (từ trái sang phải); js/app.js (mục "Trái Đất quay trong logo") vẽ các đường dưới đây -->
          <g id="elEarth">
            <path id="elLand" fill="url(#landfill)" stroke="#6b4a10" stroke-width=".22" stroke-opacity=".7" stroke-linejoin="round"/>
            <path id="elLake" fill="url(#oceanU)"/>
            <path id="elIce" fill="#fffbe8" fill-opacity=".92"/>
            <path id="elCloud" fill="#fff" fill-opacity=".4"/>
            <g id="elDots" fill="#fff8d6" stroke="#5b3b08" stroke-width=".08"></g>
          </g>
          <circle cx="32" cy="36" r="21" fill="url(#shade)"/>
          <circle cx="32" cy="36" r="21" fill="url(#shine)"/>
        </g>
        <circle cx="32" cy="36" r="21" fill="none" stroke="#fff0b3" stroke-opacity=".85" stroke-width="1"/>
        <!-- Vòng vàng do tên lửa vẽ nên -->
        <g transform="translate(32 36) rotate(-20)">
          <g clip-path="url(#orbFront)">
            <path id="orbit" d="M-30,0 a30,9 0 1,0 60,0 a30,9 0 1,0 -60,0" pathLength="100" fill="none" stroke="#ffd23f" stroke-opacity=".35" stroke-width="5" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="100">
              <animate attributeName="stroke-dashoffset" dur="10s" begin="-6s" repeatCount="indefinite" values="100;0;0;0" keyTimes="0;.3;.85;1"/>
              <animate attributeName="opacity" dur="10s" begin="-6s" repeatCount="indefinite" values="1;1;1;0" keyTimes="0;.3;.85;1"/>
            </path>
            <path d="M-30,0 a30,9 0 1,0 60,0 a30,9 0 1,0 -60,0" pathLength="100" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="100">
              <animate attributeName="stroke-dashoffset" dur="10s" begin="-6s" repeatCount="indefinite" values="100;0;0;0" keyTimes="0;.3;.85;1"/>
              <animate attributeName="opacity" dur="10s" begin="-6s" repeatCount="indefinite" values="1;1;1;0" keyTimes="0;.3;.85;1"/>
            </path>
          </g>
          <g>
            <animateMotion dur="10s" begin="-6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.3;1" calcMode="linear"><mpath href="#orbit"/></animateMotion>
            <animate attributeName="opacity" dur="10s" begin="-6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.149;.15;1"/>
            <g transform="scale(1.35)">
              <path class="flame" d="M-5,-1.7 L-12,0 L-5,1.7Z" fill="#ffb300"/>
              <path d="M-5,-1 L-8.5,0 L-5,1Z" fill="#fff6c8"/>
              <path d="M7,0 C4,-3 0,-3 -5,-2.6 L-5,2.6 C0,3 4,3 7,0Z" fill="#fff6d0" stroke="#6b4a10" stroke-width=".55"/>
              <circle cx="1" cy="0" r="1.3" fill="#6b4a10" stroke="#fff1b3" stroke-width=".4"/>
              <path d="M-2.6,-2.5 L-6.5,-5.2 L-5,-2.5Z M-2.6,2.5 L-6.5,5.2 L-5,2.5Z" fill="#d98a1a" stroke="#6b4a10" stroke-width=".3"/>
            </g>
          </g>
        </g>
        <!-- Mũ cử nhân có dây bị giật -->
        <g class="cap">
          <path d="M18,14 v8 c0,3.5 6,6 14,6 s14,-2.5 14,-6 v-8 l-14,7z" fill="#a87a1f" stroke="#fff1b3" stroke-width=".8" stroke-linejoin="round"/>
          <path d="M32,2 L6,12 L32,22 L58,12Z" fill="url(#capgold)" stroke="#fff1b3" stroke-width="1" stroke-linejoin="round"/>
          <path d="M32,2 L58,12 L32,22Z" fill="#000" opacity=".14"/>
          <path d="M32,12 L54,13.5" stroke="#7a5518" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <circle cx="32" cy="12" r="1.9" fill="#fff6c8" stroke="#8a6420" stroke-width=".4"/>
          <g class="cord">
            <line x1="54" y1="13.5" x2="54" y2="26" stroke="#ffe680" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M52,26 h4 l1.2,6 h-6.4z" fill="#ffc400" stroke="#c98f00" stroke-width=".4"/>
            <path d="M51.8,32 l-.3,2.2 M53.3,32 v2.4 M54.7,32 v2.4 M56.2,32 l.3,2.2" stroke="#ffc400" stroke-width=".7" stroke-linecap="round"/>
          </g>
        </g>
        </g>
      </svg>
      <div class="name">EDU<br>VERSE</div>
      <div class="tag">HỆ SINH THÁI<br>GIÁO DỤC SỐ</div>
    </div>
    <div class="auth">
      <button class="pill-auth" id="bLogin">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>ĐĂNG NHẬP</button>
      <button class="pill-auth" id="bReg">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M2 21a8 8 0 0 1 16 0"/><path d="M19 8v6M16 11h6"/></svg>ĐĂNG KÝ</button>
    </div>
  </div>

  <div class="stage">
    <div class="sky"><i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="hill h1"></i><i class="hill h2"></i></div>
    <div class="main" id="main"></div>
  </div>

  <nav id="nav">
    <button data-t="learn" aria-label="Học tập"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2z"/><path d="M12 6v14"/><path d="M5.5 7.5c1.2.1 2.4.3 3.5.7M5.5 10.5c1.2.1 2.4.3 3.5.7M5.5 13.5c1.2.1 2.4.3 3.5.7M18.5 7.5c-1.2.1-2.4.3-3.5.7M18.5 10.5c-1.2.1-2.4.3-3.5.7M18.5 13.5c-1.2.1-2.4.3-3.5.7" stroke-width="1.2"/></svg></button>
    <button data-t="cat" aria-label="Danh mục"><svg viewBox="0 0 24 24" fill="#000"><rect x="2.5" y="4" width="19" height="4.6" rx="2.3"/><rect x="2.5" y="9.7" width="19" height="4.6" rx="2.3"/><rect x="2.5" y="15.4" width="19" height="4.6" rx="2.3"/></svg></button>
    <button data-t="home" class="on" aria-label="Trang chủ"><svg viewBox="0 0 24 24" fill="#000"><path d="M12 2.5 1.5 12l1.2 1.3L4 12.2V21h6v-6h4v6h6v-8.8l1.3 1.1L22.5 12 19 8.9V4h-3v2.2z"/></svg></button>
    <button data-t="practice" aria-label="Luyện tập"><svg viewBox="0 0 24 24" fill="#000"><path d="M7 6h10c3 0 4.5 2.4 5 6l.6 4c.3 2.2-1 3.5-2.6 3.5-1.2 0-2-.6-2.9-1.9L15.5 15h-7l-1.6 2.6c-.9 1.300-1.700 1.900-2.900 1.900C2.400 19.500 1.100 18.200 1.400 16l.6-4c.5-3.600 2-6 5-6z"/><path d="M7.500 9.200v1.600H5.900v1.400h1.600v1.600h1.400v-1.600h1.600v-1.400H8.900V9.200z" fill="#fff"/><circle cx="15.500" cy="9.800" r=".95" fill="#fff"/><circle cx="17.800" cy="12" r=".95" fill="#fff"/></svg></button>
    <button data-t="me" aria-label="Cá nhân"><svg viewBox="0 0 24 24" fill="#000"><circle cx="12" cy="7.5" r="4.6"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z"/></svg></button>
  </nav>

  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script src="js/data.js"></script>
<script src="js/sims/common.js"></script>

<!-- CDN dự phòng: vẫn nạp được Three.js nếu jsDelivr bị chặn hoặc lỗi mạng -->
<script src="https://unpkg.com/three@0.147.0/build/three.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js" crossorigin="anonymous"></script>

</body>
